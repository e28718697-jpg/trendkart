        .puck-light {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-glow);
            z-index: 3;
        }

        .puck-light.off {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .puck-light::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: 2;
        }

        .puck-leds {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
            opacity: 0;
            transition: var(--transition);
            z-index: 1;
        }

        .puck-light.off .puck-leds {
            opacity: 0;
        }

        .puck-light.on .puck-leds {
            opacity: 1;
        }

        .puck-switch {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 12px;
            background: #333;
            border-radius: 6px;
            padding: 2px;
        }

        .puck-switch::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 0;
            left: 0;
            transition: var(--transition);
        }

        .puck-light.on .puck-switch::after {
            transform: translateX(28px);
        }
